function getLens() { return LENSES[currentIndex]; }
function getStartDate(lens) { return lens.operations.length ? lens.operations[0].date : null; }
function getDeliverDate(lens) { const op = lens.operations.find(o => o.type === 'deliver'); return op ? op.date : null; }
function getWearDays(lens) {
    const delDate = getDeliverDate(lens);
    if (!delDate) return null;
    return Math.floor((new Date() - new Date(delDate)) / (1000*60*60*24));
}
function getCheckupInterval(lens, op) {
    if (op.type !== 'checkup') return null;
    const delDate = getDeliverDate(lens);
    if (!delDate) return null;
    return Math.floor((new Date(op.date) - new Date(delDate)) / (1000*60*60*24));
}
function getLastTrialData(lens) {
    const trials = lens.operations.filter(o => o.type === 'trial' && o.trialData);
    if (!trials.length) return null;
    const last = trials[trials.length-1];
    const result = {};
    ['left','right'].forEach(eye => {
        if (last.trialData[eye]) {
            const d = last.trialData[eye];
            result[eye] = { brand: d.brand, baseCurve: d.baseCurve, steepK: d.steepK, reduction: d.reduction, power: d.power, diameter: d.diameter };
        }
    });
    return result;
}

// ============================================================
// 生成关键信息（用于搜索与显示）
// ============================================================
function buildKeyInfo(op) {
    let statusSummary = '';
    if (op.type === 'checkup' && op.checkupData) {
        const od = op.checkupData.od || {};
        const os = op.checkupData.os || {};
        const parts = [];
        if (od.cleanliness && od.cleanliness !== '清洁') parts.push(`OD:${od.cleanliness}`);
        if (os.cleanliness && os.cleanliness !== '清洁') parts.push(`OS:${os.cleanliness}`);
        if (od.scratches && od.scratches !== '无') parts.push(`OD划痕:${od.scratches}`);
        if (os.scratches && os.scratches !== '无') parts.push(`OS划痕:${os.scratches}`);
        if (parts.length) statusSummary = `镜片: ${parts.join('; ')}`;
    } else if (op.type === 'deliver' && op.deliverData) {
        const d = op.deliverData;
        statusSummary = `品牌:${d.brand} 下次:${d.nextFollowup}`;
    } else if (op.type === 'pickup' && op.pickupData) {
        const p = op.pickupData;
        statusSummary = `联系人:${p.contactPerson || ''} 方式:${p.method || ''}`;
    }
    return op.detail + (statusSummary ? ' ' + statusSummary : '');
}

// ============================================================
function renderSteps(lens) {
    const ops = lens.operations;
    const checkups = ops.filter(o => o.type === 'checkup').sort((a,b) => new Date(a.date) - new Date(b.date));
    const stepTypes = [];
    const pre = ['trial','order','custom','pickup','deliver'];
    pre.forEach(t => {
        const found = ops.find(o => o.type === t);
        if (found) stepTypes.push({ type: t, date: found.date, label: found.label });
    });
    checkups.forEach((c, idx) => {
        const days = getCheckupInterval(lens, c);
        let label = `复查${idx+1}`;
        if (days !== null) {
            if (days === 0) label += ' (当日)';
            else if (days < 7) label += ` (${days}天)`;
            else if (days < 30) label += ` (${Math.floor(days/7)}周)`;
            else if (days < 365) label += ` (${Math.floor(days/30)}月)`;
            else label += ` (${Math.floor(days/365)}年)`;
        }
        stepTypes.push({ type: 'checkup', date: c.date, label: label, isCheckup: true });
    });
    const replace = ops.find(o => o.type === 'replace');
    if (replace) stepTypes.push({ type: 'replace', date: replace.date, label: '换片' });
    const terminate = ops.find(o => o.type === 'terminate');
    if (terminate) stepTypes.push({ type: 'terminate', date: terminate.date, label: '终止' });

    const lastOp = ops.length ? ops[ops.length-1] : null;
    let html = '';
    stepTypes.forEach((node, idx) => {
        let cls = '';
        let dateStr = node.date || '';
        const isDone = ops.some(o => o.type === node.type && o.date === node.date);
        if (isDone) cls = 'done';
        if (lastOp && node.type === lastOp.type && node.date === lastOp.date) {
            cls = 'current';
        }
        if (lastOp && lastOp.type === 'checkup' && node.isCheckup && node.date === lastOp.date) {
            cls = 'current';
        }
        let circleText = '';
        if (node.type === 'trial') circleText = '试';
        else if (node.type === 'order') circleText = '定';
        else if (node.type === 'custom') circleText = '验';
        else if (node.type === 'pickup') circleText = '等';
        else if (node.type === 'deliver') circleText = '交';
        else if (node.type === 'checkup') {
            const idx = checkups.findIndex(c => c.date === node.date);
            circleText = `复${idx+1}`;
        } else if (node.type === 'replace') circleText = '换';
        else if (node.type === 'terminate') circleText = '终';

        html += `<div class="step-item ${cls}"><div class="circle">${circleText}</div><div class="step-label">${node.label}</div>${dateStr ? `<div class="step-date">${dateStr}</div>` : ''}</div>`;
        if (idx < stepTypes.length-1) {
            const isDone = ops.some(o => o.type === node.type && o.date === node.date);
            html += `<div class="step-connector ${isDone?'done':''}"><div class="line"></div><div class="dur">${isDone?'✓':'—'}</div></div>`;
        }
    });
    document.getElementById('stepRow').innerHTML = html;
}

// ============================================================
// 操作记录（分页 + 搜索）
// ============================================================
function renderOps(lens, page, search) {
    search = (search || '').trim().toLowerCase();
    let allOps = lens.operations.filter(op => op.type !== 'payment');
    allOps.sort((a,b) => new Date(b.date) - new Date(a.date));

    if (search) {
        allOps = allOps.filter(op => {
            const keyInfo = buildKeyInfo(op).toLowerCase();
            const label = (op.label || '').toLowerCase();
            const operator = (op.operator || '').toLowerCase();
            return keyInfo.includes(search) || label.includes(search) || operator.includes(search);
        });
    }

    const total = allOps.length;
    document.getElementById('opsCount').textContent = total;

    const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
    if (page < 1) page = 1;
    if (page > totalPages) page = totalPages;
    currentPage = page;

    const start = (page - 1) * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, total);
    const pageData = allOps.slice(start, end);

    const badgeMap = { trial:'trial', order:'order', custom:'custom', pickup:'pickup', deliver:'deliver', checkup:'checkup', replace:'replace', terminate:'terminate' };
    let html = '';
    if (pageData.length === 0) {
        html = `<tr class="empty-row"><td colspan="6">📭 ${search ? '无匹配记录' : '暂无记录'}</td></tr>`;
    } else {
        pageData.forEach((op) => {
            const originalIndex = lens.operations.indexOf(op);
            let intervalHtml = '';
            if (op.type === 'checkup') {
                const days = getCheckupInterval(lens, op);
                if (days !== null) intervalHtml = `<span class="interval-tag">交付后 ${days} 天</span>`;
            } else if (op.type === 'replace' || op.type === 'terminate') {
                intervalHtml = `<span class="interval-tag">结束</span>`;
            }
            const keyInfo = buildKeyInfo(op);
            const isRecent = (() => {
                const d = new Date(op.date);
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                return d >= thirtyDaysAgo;
            })();

            html += `<tr>
                <td>${op.date}${isRecent ? ' 🆕' : ''}</td>
                <td><span class="badge-op ${badgeMap[op.type]||''}">${op.label}</span></td>
                <td>${keyInfo}</td>
                <td>${intervalHtml}</td>
                <td>${op.operator}</td>
                <td><span class="link-detail" onclick="showDetail(${originalIndex})">查看详情</span></td>
            </tr>`;
        });
    }
    document.getElementById('opsBody').innerHTML = html;
    renderPagination(totalPages);
}

function renderPagination(totalPages) {
    const container = document.getElementById('pagination');
    const current = currentPage;
    let html = '';
    html += `<button onclick="goToPage(${current-1})" ${current<=1?'disabled':''}>上一页</button>`;
    html += `<span class="page-info">第 ${current} / ${totalPages} 页</span>`;
    html += `<button onclick="goToPage(${current+1})" ${current>=totalPages?'disabled':''}>下一页</button>`;
    html += `<span style="margin-left:8px;">跳转：</span>`;
    html += `<input class="page-input" type="number" min="1" max="${totalPages}" id="pageJumpInput" value="${current}" onkeydown="if(event.key==='Enter') jumpToPage()">`;
    html += `<button onclick="jumpToPage()">Go</button>`;
    container.innerHTML = html;
}

function goToPage(page) {
    const lens = getLens();
    let allOps = lens.operations.filter(op => op.type !== 'payment');
    allOps.sort((a,b) => new Date(b.date) - new Date(a.date));
    const search = (currentSearch || '').trim().toLowerCase();
    if (search) {
        allOps = allOps.filter(op => {
            const keyInfo = buildKeyInfo(op).toLowerCase();
            const label = (op.label || '').toLowerCase();
            const operator = (op.operator || '').toLowerCase();
            return keyInfo.includes(search) || label.includes(search) || operator.includes(search);
        });
    }
    const totalPages = Math.ceil(allOps.length / PAGE_SIZE) || 1;
    if (page < 1) page = 1;
    if (page > totalPages) page = totalPages;
    currentPage = page;
    renderOps(lens, page, currentSearch);
}

function jumpToPage() {
    const input = document.getElementById('pageJumpInput');
    let page = parseInt(input.value);
    if (isNaN(page) || page < 1) page = 1;
    const lens = getLens();
    let allOps = lens.operations.filter(op => op.type !== 'payment');
    allOps.sort((a,b) => new Date(b.date) - new Date(a.date));
    const search = (currentSearch || '').trim().toLowerCase();
    if (search) {
        allOps = allOps.filter(op => {
            const keyInfo = buildKeyInfo(op).toLowerCase();
            const label = (op.label || '').toLowerCase();
            const operator = (op.operator || '').toLowerCase();
            return keyInfo.includes(search) || label.includes(search) || operator.includes(search);
        });
    }
    const totalPages = Math.ceil(allOps.length / PAGE_SIZE) || 1;
    if (page > totalPages) page = totalPages;
    input.value = page;
    goToPage(page);
}

// 辅助函数
// ============================================================
function quickOrderFromTrial(eye, brand, baseCurve, steepK, reduction, power, diameter) {
    closeDetailModal();
    openModal('order');
    setTimeout(() => {
        const brandSelect = document.getElementById(eye === 'left' ? 'leftBrand' : 'rightBrand');
        if (brandSelect) {
            brandSelect.value = brand || '梦戴维';
            fillBrandParams(eye === 'left' ? 'left' : 'right');
        }
        const prefix = eye === 'left' ? 'left' : 'right';
        const map = { baseCurve, steepK, reduction, power, diameter };
        Object.keys(map).forEach(key => {
            const input = document.getElementById(`${prefix}_${key}`);
            if (input) input.value = map[key] || '';
        });
        const orderInput = document.querySelector('#modalBody input[placeholder*="自动生成"]');
        if (orderInput) {
            const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
            orderInput.value = `OK-${today}-001`;
        }
        alert('✅ 已填充该眼品牌及参数，请确认后保存。');
    }, 150);
}
function quickOrderFromLastTrial() {
    const lens = getLens();
    const lastTrial = getLastTrialData(lens);
    if (!lastTrial) { alert('没有找到试戴记录，请先进行试戴。'); return; }
    setTimeout(() => {
        ['left','right'].forEach(eye => {
            const data = lastTrial[eye === 'left' ? 'left' : 'right'];
            if (data) {
                const brandSelect = document.getElementById(eye === 'left' ? 'leftBrand' : 'rightBrand');
                if (brandSelect) {
                    brandSelect.value = data.brand || '梦戴维';
                    fillBrandParams(eye);
                }
                const prefix = eye;
                const map = { baseCurve: data.baseCurve, steepK: data.steepK, reduction: data.reduction, power: data.power, diameter: data.diameter };
                Object.keys(map).forEach(key => {
                    const input = document.getElementById(`${prefix}_${key}`);
                    if (input) input.value = map[key] || '';
                });
            }
        });
        alert('✅ 已从最近试戴填充双眼品牌及参数，请确认后保存。');
    }, 150);
}
function exportParams() {
    const prefixs = ['left', 'right'];
    let lines = ['===== 双眼定片参数 ====='];
    prefixs.forEach(p => {
        const brand = document.getElementById(`${p}Brand`)?.value || '';
        const baseCurve = document.getElementById(`${p}_baseCurve`)?.value || '';
        const steepK = document.getElementById(`${p}_steepK`)?.value || '';
        const reduction = document.getElementById(`${p}_reduction`)?.value || '';
        const power = document.getElementById(`${p}_power`)?.value || '';
        const diameter = document.getElementById(`${p}_diameter`)?.value || '';
        const ct = document.getElementById(`${p}_centerThickness`)?.value || '';
        const eyeLabel = p === 'left' ? '左眼 (OS)' : '右眼 (OD)';
        let line = `${eyeLabel} : 品牌=${brand}`;
        if (baseCurve) line += `, 基弧=${baseCurve}`;
        if (steepK) line += `, 陡峭曲率=${steepK}`;
        if (reduction) line += `, 降度=${reduction}`;
        if (power) line += `, 度数=${power}`;
        if (diameter) line += `, 直径=${diameter}`;
        if (ct) line += `, 中心厚度=${ct}`;
        lines.push(line);
    });
    lines.push('==========================');
    const text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert('✅ 参数已复制到剪贴板。')).catch(() => prompt('复制以下内容保存：', text));
    } else {
        prompt('复制以下内容保存：', text);
    }
}

function sendSms(phone, content) {
    alert(`📨 短信已发送至 ${phone}\n\n内容：\n${content}`);
    return true;
}

// 品牌联动：动态渲染参数项目
// ============================================================
function fillBrandParams(eyePrefix) {
    const brandSelect = document.getElementById(`${eyePrefix}Brand`);
    if (!brandSelect) return;
    const brand = brandSelect.value;
    const config = BRAND_PARAMS[brand];
    if (!config) return;

    const container = document.getElementById(`${eyePrefix}ParamsContainer`);
    if (!container) return;

    let html = '';
    config.params.forEach(paramKey => {
        const label = config.paramLabels[paramKey] || paramKey;
        const inputId = `${eyePrefix}_${paramKey}`;
        html += `
            <div class="param-group">
                <div class="param-label">${label}</div>
                <input id="${inputId}" type="text" placeholder="请输入${label}" />
            </div>
        `;
    });
    container.innerHTML = html;

    const hintEl = document.getElementById(`${eyePrefix}BrandHint`);
    if (hintEl) {
        hintEl.textContent = config.hint || '';
    }
}

function sendSmsFromModal() {
    const recipientSelect = document.getElementById('smsRecipient');
    let phone = '';
    if (recipientSelect) {
        if (recipientSelect.value === 'patient') {
            phone = document.getElementById('patientPhone')?.value || PATIENT.phone;
        } else {
            phone = document.getElementById('contactPhone')?.value || PATIENT.contactPhone;
        }
    } else {
        phone = PATIENT.phone;
    }
    const content = document.getElementById('smsContent')?.value || '';
    if (!content.trim()) { alert('短信内容不能为空'); return; }
    const success = sendSms(phone, content);
    if (success) {
        alert('✅ 短信已发送，记录将保存。');
    }
}

function saveModal() {
    const lens = getLens();
    const now = new Date();
    const dateStr = now.toISOString().slice(0,10);
    const actionMap = {
        trial: { type: 'trial', label: '试戴', detail: '新试戴 · 左右眼评估完成', operator: '林医生' },
        order: { type: 'order', label: '定片', detail: '定片完成，费用已生成', operator: '林医生' },
        custom_done: { type: 'custom', label: '验片', detail: '验片完成 · 已到货', operator: '林医生' },
        pickup_notify: { type: 'pickup', label: '电话通知取片', detail: '已通知患者取片', operator: '林医生' },
        deliver_confirm: { type: 'deliver', label: '交付', detail: '交付取片完成', operator: '林医生' },
        checkup: { type: 'checkup', label: '复查', detail: '复查完成', operator: '林医生' },
        replace: { type: 'replace', label: '换片', detail: '换片 · 开启新周期', operator: '林医生' },
        terminate: { type: 'terminate', label: '终止', detail: '终止治疗 · 已归档', operator: '林医生' }
    };
    const info = actionMap[modalAction];
    if (!info) { closeModal(); return; }

    let trialData = null;
    if (modalAction === 'trial') {
        const left = collectEyeParams('left');
        const right = collectEyeParams('right');
        ['left', 'right'].forEach(eye => {
            const data = eye === 'left' ? left : right;
            data.centerPos = document.getElementById(`${eye}_centerPos`)?.value || '';
            data.slide = document.getElementById(`${eye}_slide`)?.value || '';
            data.staining = document.getElementById(`${eye}_staining`)?.value || '';
            data.conclusion = document.getElementById(`${eye}_conclusion`)?.value || '';
        });
        trialData = { left, right };
    }

    let orderData = null;
    if (modalAction === 'order') {
        const left = collectEyeParams('left');
        const right = collectEyeParams('right');
        orderData = { left, right };
    }

    let checkupData = null;
    if (modalAction === 'checkup') {
        const inputs = document.querySelectorAll('#modalBody input');
        const selects = document.querySelectorAll('#modalBody select');
        if (inputs.length >= 6 && selects.length >= 10) {
            checkupData = {
                od: {
                    va: inputs[0].value,
                    iop: inputs[1].value,
                    axial: inputs[2].value,
                    cornea: selects[0].value,
                    cleanliness: selects[1].value,
                    scratches: selects[2].value,
                    deposit: selects[3].value,
                    integrity: selects[4].value
                },
                os: {
                    va: inputs[3].value,
                    iop: inputs[4].value,
                    axial: inputs[5].value,
                    cornea: selects[5].value,
                    cleanliness: selects[6].value,
                    scratches: selects[7].value,
                    deposit: selects[8].value,
                    integrity: selects[9].value
                }
            };
        }
    }

    let deliverData = null;
    if (modalAction === 'deliver_confirm') {
        const inputs = document.querySelectorAll('#modalBody input');
        const selects = document.querySelectorAll('#modalBody select');
        if (inputs.length >= 18 && selects.length >= 18) {
            deliverData = {
                od: {
                    correctedVision: inputs[1].value,
                    vision: inputs[2].value,
                    sphere: inputs[3].value,
                    cylinder: inputs[4].value,
                    axis: inputs[5].value,
                    va: inputs[6].value
                },
                os: {
                    correctedVision: inputs[7].value,
                    vision: inputs[8].value,
                    sphere: inputs[9].value,
                    cylinder: inputs[10].value,
                    axis: inputs[11].value,
                    va: inputs[12].value
                },
                adapt: {
                    od: {
                        baseCurveZone: selects[0].value,
                        centerContact: selects[1].value,
                        reverseArc: selects[2].value,
                        alignmentArc: selects[3].value,
                        blinkPos: selects[4].value,
                        postBlinkPos: selects[5].value,
                        peripheralArc: selects[6].value,
                        mobility: selects[7].value
                    },
                    os: {
                        baseCurveZone: selects[8].value,
                        centerContact: selects[9].value,
                        reverseArc: selects[10].value,
                        alignmentArc: selects[11].value,
                        blinkPos: selects[12].value,
                        postBlinkPos: selects[13].value,
                        peripheralArc: selects[14].value,
                        mobility: selects[15].value
                    }
                },
                brand: selects[16].value,
                baseCurve: inputs[13].value,
                steepK: inputs[14].value,
                reduction: inputs[15].value,
                power: inputs[16].value,
                diameter: inputs[17].value,
                needNewPrescription: document.querySelector('input[name="needPrescription"]:checked')?.value === 'true',
                guide: {
                    戴镜摘镜: document.querySelector('input[type="checkbox"]:nth-of-type(1)')?.checked || false,
                    镜片护理: document.querySelector('input[type="checkbox"]:nth-of-type(2)')?.checked || false
                },
                nextFollowup: selects[17].value
            };
        }
    }

    let pickupData = null;
    if (modalAction === 'pickup_notify') {
        const method = document.getElementById('notifyMethod')?.value || '电话';
        const contactPerson = document.getElementById('contactPerson')?.value || '';
        const contactPhone = document.getElementById('contactPhone')?.value || '';
        const smsContent = document.getElementById('smsContent')?.value || '';
        const recipientSelect = document.getElementById('smsRecipient');
        let recipient = '患者本人';
        if (recipientSelect) {
            recipient = recipientSelect.value === 'patient' ? '患者本人' : '联系人';
        }
        pickupData = {
            patientPhone: PATIENT.phone,
            contactPerson: contactPerson,
            contactPhone: contactPhone,
            method: method,
            smsContent: smsContent,
            recipient: recipient,
            remark: document.getElementById('pickupRemark')?.value || ''
        };
        if (method === '短信' && smsContent) {
            info.detail += ` (短信已发送给${recipient})`;
        }
    }

    if (modalAction === 'replace' || modalAction === 'terminate') {
        lens.endDate = dateStr;
        lens.endReason = modalAction === 'replace' ? '换片' : '终止治疗';
    }

    const newOp = { date: dateStr, type: info.type, label: info.label, detail: info.detail, operator: '林医生' };
    if (trialData) newOp.trialData = trialData;
    if (orderData) newOp.orderData = orderData;
    if (checkupData) newOp.checkupData = checkupData;
    if (deliverData) newOp.deliverData = deliverData;
    if (pickupData) newOp.pickupData = pickupData;
    lens.operations.push(newOp);

    closeModal();
    renderAll();
}

function collectEyeParams(prefix) {
    const brand = document.getElementById(`${prefix}Brand`)?.value || '';
    const config = BRAND_PARAMS[brand];
    const params = {};
    if (config) {
        config.params.forEach(key => {
            const input = document.getElementById(`${prefix}_${key}`);
            params[key] = input ? input.value : '';
        });
    }
    params.brand = brand;
    return params;
}
